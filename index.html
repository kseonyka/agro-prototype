<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Агро · помощник в поле</title>
<style>
:root{--bg:#f3f5ef;--ink:#18392e;--green:#225b43;--lime:#d9ec8e;--muted:#64746b;--line:#dfe5d9;--amber:#956123}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:3px solid #85a53c;outline-offset:3px}button{border:0;border-radius:14px;min-height:46px;padding:11px 16px;background:var(--green);color:white;font-weight:650}button:disabled{opacity:.45;cursor:default}.secondary{background:#eaf0e3;color:var(--ink)}.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}.danger{background:#fae8df;color:#953d23}.small{padding:8px 12px;font-size:13px}.wide{width:100%}.app{max-width:600px;margin:auto;min-height:100vh;background:var(--bg)}header{padding:20px 20px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:25px;font-weight:800;letter-spacing:-1px}.brand span{color:#759340}header small{display:block;color:var(--muted);font-size:11px;letter-spacing:1px}header select{width:auto;padding:9px;border-radius:12px;font-size:13px;background:white}.ribbon{padding:0 20px 12px;display:flex;justify-content:space-between;color:var(--muted);font-size:11px}.ribbon b{font-weight:600}.content{padding:8px 20px 118px}h1{font-size:30px;line-height:1.15;letter-spacing:-1px;margin:7px 0 10px}h2{font-size:19px;margin:8px 0 12px}h3{font-size:16px;margin:0 0 7px}p{margin:7px 0 14px}.muted{color:var(--muted)}.eyebrow{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700}.hero{background:var(--green);color:white;padding:23px;border-radius:24px;margin:16px 0 22px;position:relative;overflow:hidden}.hero .muted{color:#d7e3d8}.hero button{background:var(--lime);color:var(--ink)}.hero:after{content:"";position:absolute;width:150px;height:150px;border:1px solid #ffffff22;border-radius:50%;right:-60px;top:-70px;pointer-events:none}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.row.top{align-items:flex-start}.stack{display:grid;gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:14px 10px}.stat strong{display:block;font-size:25px;line-height:1.2}.stat span{font-size:11px;color:var(--muted)}.tag{display:inline-block;font-size:11px;padding:4px 9px;border-radius:20px;background:#edf2e6;color:var(--green);font-weight:650}.tag.warn{background:#fff0d8;color:#8b5e1d}.tag.gray{background:#edf0ef;color:#5d6b65}.notice{background:#eef3df;border-left:3px solid #8aa641;border-radius:10px;padding:12px 14px;margin:12px 0;font-size:13px}.notice.warn{background:#fff3df;border-color:#dca146}.actions{display:grid;gap:9px;margin-top:16px}label{display:block;font-size:13px;font-weight:650;margin:14px 0 6px}input,select,textarea{width:100%;border:1px solid #cfd9c9;border-radius:12px;background:white;color:var(--ink);padding:12px;min-height:46px}textarea{resize:vertical;min-height:85px}input[type=checkbox]{width:21px;min-height:21px;accent-color:var(--green)}.check{display:flex;align-items:center;gap:10px;font-weight:400}.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.photo{aspect-ratio:1;border-radius:14px;object-fit:cover;width:100%;background:#e4ebd6}.demo-leaf{display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#e4eac8,#a6b97b);font-size:35px}.progress{height:6px;border-radius:9px;background:#e7ebde;margin:16px 0;overflow:hidden}.progress i{display:block;background:#7da044;height:100%}.timeline{border-left:2px solid #dce5d2;padding-left:15px;margin:16px 0}.timeline p{font-size:13px}.timeline small{color:var(--muted)}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,600px);display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px calc(10px + env(safe-area-inset-bottom));background:#fffffff2;backdrop-filter:blur(15px);border-top:1px solid var(--line);z-index:10}nav button{background:transparent;color:var(--muted);font-size:11px;padding:5px 2px;min-height:52px;border-radius:12px}nav button span{display:block;font-size:21px;line-height:1.3}nav button.active{color:var(--green);background:#eef4e4}.back{padding:6px 0;background:transparent;color:var(--green);min-height:40px}.empty{text-align:center;padding:28px 10px}.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#173c2e;color:white;padding:12px 18px;border-radius:14px;z-index:100;max-width:92%;box-shadow:0 8px 40px #0002;font-size:13px}.map{background:#e1e9d5;border-radius:18px;padding:16px;display:grid;grid-template-columns:1.4fr 1fr;gap:9px;margin:16px 0;min-height:155px}.map button{background:#acc48b;color:#23412f;border:2px solid white;border-radius:15px}.map button:nth-child(2){background:#d2d99a}.map button:nth-child(3){grid-column:1/3;background:#b9caa0}.divider{height:1px;background:var(--line);margin:16px 0}details summary{cursor:pointer;font-weight:650;min-height:44px;padding:10px 0}a{color:var(--green)}.taskdone{text-decoration:line-through;color:var(--muted)}@media(max-width:360px){.content{padding-left:14px;padding-right:14px}header{padding-left:14px;padding-right:14px}h1{font-size:27px}.two{grid-template-columns:1fr}}@media(min-width:700px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style></head><body><div class="app"><header><div><div class="brand">агро<span> /</span></div><small>ПОМОЩНИК В ПОЛЕ</small></div><select id="role" aria-label="Роль"><option value="agro">Агроном · Анна</option><option value="manager">Руководитель · Ирина</option></select></header><div class="ribbon"><span>Хозяйство «Колос» · демо</span><b id="storage"></b></div><main class="content" id="view"></main><nav id="nav" aria-label="Основные разделы"></nav></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const KEY='agro-mobile-v1'; const fields=[{id:'12',name:'Северное',area:120,phase:'Выход в трубку'},{id:'7',name:'У реки',area:85,phase:'Кущение'},{id:'3',name:'Южное',area:64,phase:'Выход в трубку'}];
const seed=()=>({role:'agro',draft:null,cases:[{id:'C12',field:'12',title:'Пятна на нижних листьях',status:'review',diagnosis:'Подозрение на септориоз',phase:'Выход в трубку',spread:'Отдельные очаги',note:'Обнаружено в двух точках. Нужен осмотр верхних листьев.',photos:[],demo:true,history:[{text:'Наблюдение создано: пятна на нижних листьях',date:'Демо · первый осмотр'}],tasks:[],plan:null,reviews:[]},{id:'C7',field:'7',title:'Пожелтение растений',status:'active',diagnosis:'Причина уточняется',phase:'Кущение',spread:'Край поля',note:'Проверить переувлажнение и питание.',photos:[],demo:true,history:[{text:'Утверждён план дополнительного обследования',date:'Демо · вчера'}],plan:{type:'Обследование',owner:'Анна · агроном',date:'',cost:3500,note:'Проверить состояние почвы и корней.',approval:'approved'},tasks:[{id:'T7',name:'Осмотреть корни и почву в трёх точках',owner:'Анна · агроном',due:'',done:false,late:true,proof:'',reason:''}],reviews:[]}]});
let s=seed(),persistent=true;try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);if(p&&Array.isArray(p.cases)&&['agro','manager'].includes(p.role))s=p}}catch(e){persistent=false}
let page='home',selected='C12',selectedField='12',tab='summary',draft=s.draft||null,uploaded=[],reviewPhotos=[];
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>new Date().toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const f=id=>fields.find(x=>x.id===id)||fields[0];
const c=()=>s.cases.find(x=>x.id===selected);
const status={review:'Нужна проверка',insufficient:'Нужны данные',expert:'Ожидаем эксперта',confirmed:'Решение принято',pending:'На согласовании',revision:'Уточнить план',rejected:'План отклонён',active:'План выполняется',control:'Контроль результата',closed:'Закрыто'};
function save(){s.draft=draft;try{localStorage.setItem(KEY,JSON.stringify(s));persistent=true}catch(e){persistent=false} $('storage').textContent=persistent?'Сохранено на устройстве':'Хранение только в этой вкладке'}
function log(x,text){x.history.unshift({text,date:now()})}
function toast(text){$('toast').className='toast';$('toast').textContent=text;setTimeout(()=>{$('toast').className='';$('toast').textContent=''},3200)}
function go(p,id){page=p;if(id)selected=id;tab='summary';render();window.scrollTo(0,0)}
function badge(x){return '<span class="tag '+(['review','pending','revision','insufficient','rejected'].includes(x.status)?'warn':'')+'">'+status[x.status]+'</span>'}
function photos(list,demo=false){return '<div class="photos">'+(list.length?list.map(p=>'<img class="photo" alt="Фото наблюдения" src="'+esc(p)+'">').join(''):demo?'<div class="photo demo-leaf" aria-label="Демонстрационная иллюстрация">🌾</div><div class="photo demo-leaf">🍃</div>':'')+'</div>'}
function card(x){return '<article class="card"><div class="row"><span class="eyebrow">Поле № '+esc(x.field)+'</span>'+badge(x)+'</div><h3 style="margin-top:12px">'+esc(x.title)+'</h3><p class="muted">'+esc(f(x.field).name)+' · Пшеница · '+esc(x.spread)+'</p><button class="ghost wide" data-act="case" data-id="'+x.id+'">Открыть случай →</button></article>'}
function buttons(){return s.role==='agro'?[['home','◷','Сегодня'],['fields','▧','Поля'],['observe','＋','Осмотр'],['cases','☷','Случаи']]:[['home','◷','Обзор'],['approvals','✓','Решения'],['fields','▧','Поля'],['tasks','☷','Работы']]}
function home(){const active=s.cases.filter(x=>x.status!=='closed'),pending=s.cases.filter(x=>x.status==='pending'),tasks=s.cases.flatMap(x=>x.tasks).filter(x=>!x.done);
return '<div class="row"><span class="eyebrow">Сезон · демонстрация</span><button class="ghost small" data-act="guide">Как проверить</button></div><h1>'+ (s.role==='agro'?'В поле — с ясным планом':'Хозяйство под контролем')+'</h1><p class="muted">'+(s.role==='agro'?'Ваши наблюдения, решения и ближайшие работы.':'Что требует решения и где нужна ваша помощь.')+'</p><div class="hero"><span class="eyebrow" style="color:#d9ec8e">'+(s.role==='agro'?'Следующий шаг':'Требует внимания')+'</span><h2>'+(s.role==='agro'?'Начните с наблюдения':pending.length?pending.length+' план на согласовании':'Проверьте приоритетные случаи')+'</h2><p class="muted">'+(s.role==='agro'?'Снимите симптомы и сохраните контекст поля.':'Сроки, основания и ресурсы в одной карточке.')+'</p><button data-act="'+(s.role==='agro'?'observe':pending.length?'approvals':'cases')+'">'+(s.role==='agro'?'＋ Новый осмотр':'Открыть →')+'</button></div><div class="stats"><div class="stat"><strong>'+active.length+'</strong><span>активных случаев</span></div><div class="stat"><strong>'+tasks.length+'</strong><span>задач осталось</span></div><div class="stat"><strong>'+tasks.filter(t=>t.late).length+'</strong><span>нужен перенос</span></div></div><h2>В центре внимания</h2>'+active.slice().sort((a,b)=>(a.status==='pending'?-1:0)-(b.status==='pending'?-1:0)).slice(0,3).map(card).join('')+'<button class="ghost wide" data-act="tasks">Все работы</button><div class="notice">Демо: анализ фото, эксперт и стоимость имитируются. Реальные назначения не формируются.</div>'}
function fieldList(){return '<span class="eyebrow">Ваше хозяйство</span><h1>Поля</h1><p class="muted">Пшеница · 269 га · 3 поля</p><div class="map" aria-label="Условная схема, не географическая карта">'+fields.map(x=>'<button data-act="field" data-id="'+x.id+'">№ '+x.id+'<br>'+x.name+'</button>').join('')+'</div><small class="muted">Условная схема полей</small>'+fields.map(x=>'<article class="card"><div class="row"><div><h3>№ '+x.id+' · '+x.name+'</h3><span class="muted">'+x.area+' га · '+x.phase+'</span></div><span class="tag">'+s.cases.filter(k=>k.field===x.id&&k.status!=='closed').length+' случаев</span></div><button class="ghost wide" style="margin-top:14px" data-act="field" data-id="'+x.id+'">История поля →</button></article>').join('')}
function fieldDetail(){const x=f(selectedField);return '<button class="back" data-act="fields">← Поля</button><h1>'+x.name+'</h1><p class="muted">Поле № '+x.id+' · '+x.area+' га</p><div class="card"><h3>Пшеница · текущий сезон</h3><p>'+x.phase+'</p><p class="muted">Регион и история обработок пока не заполнены.</p></div>'+(s.role==='agro'?'<button class="wide" data-act="fieldObserve">＋ Наблюдение на этом поле</button>':'')+'<h2 style="margin-top:24px">История наблюдений</h2>'+s.cases.filter(k=>k.field===x.id).map(card).join('')+(s.cases.some(k=>k.field===x.id)?'':'<div class="card empty">Наблюдений пока нет</div>')}
function observation(){const d=draft||{field:selectedField,phase:f(selectedField).phase,spread:'Отдельные очаги',note:'',symptom:'Пятна на листьях',photos:[],scenario:'typical',location:''}; uploaded=d.photos||[];
return '<button class="back" data-act="home">← Сегодня</button><span class="eyebrow">Новый осмотр · шаг 1 из 2</span><h1>Что вы заметили?</h1><p class="muted">Сначала общий вид, затем лист и крупный план поражения.</p><form id="observation"><label for="obsField">Поле</label><select id="obsField" name="field">'+fields.map(x=>'<option value="'+x.id+'" '+(x.id===d.field?'selected':'')+'>№ '+x.id+' · '+x.name+'</option>').join('')+'</select><label for="phase">Фаза развития</label><select id="phase" name="phase">'+['Кущение','Выход в трубку','Колошение','Налив зерна','Не определена'].map(x=>'<option '+(d.phase===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label>Фотографии</label><div class="two"><label class="ghost" style="border-radius:14px;padding:12px;text-align:center;margin:0;cursor:pointer">Снять фото<input type="file" id="camera" accept="image/*" capture="environment" hidden multiple></label><label class="ghost" style="border-radius:14px;padding:12px;text-align:center;margin:0;cursor:pointer">Из галереи<input type="file" id="gallery" accept="image/*" hidden multiple></label></div><div id="preview">'+photos(uploaded,d.demo)+'</div><button type="button" class="secondary wide" data-act="sample">Использовать демо-наблюдение</button><small class="muted">До 3 фото. Только локальная обработка; изображения не отправляются на сервер.</small><label for="symptom">Симптом</label><select id="symptom" name="symptom">'+['Пятна на листьях','Пожелтение растений','Налёт на листьях','Повреждение стебля','Другое'].map(x=>'<option '+(d.symptom===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label for="spread">Распространение</label><select id="spread" name="spread">'+['Отдельные очаги','Край поля','Несколько точек','Большая часть обследованного участка','Не оценено'].map(x=>'<option '+(d.spread===x?'selected':'')+'>'+x+'</option>').join('')+'</select><label for="note">Заметка</label><textarea id="note" name="note" placeholder="Где симптомы? Какие листья поражены?">'+esc(d.note)+'</textarea><label for="location">Точка наблюдения</label><input id="location" name="location" value="'+esc(d.location)+'" placeholder="Например: северный край, точка 1"><button type="button" class="ghost wide" style="margin-top:8px" data-act="geo">Добавить координаты</button><label for="scenario">Демонстрационный результат</label><select id="scenario" name="scenario"><option value="typical" '+(d.scenario==='typical'?'selected':'')+'>Есть предварительные гипотезы</option><option value="insufficient" '+(d.scenario==='insufficient'?'selected':'')+'>Недостаточно данных</option></select><div class="actions"><button type="submit">Сохранить и посмотреть гипотезы →</button><button type="button" class="ghost" data-act="draft">Сохранить черновик</button></div></form>'}
function result(x){const insufficient=x.status==='insufficient';
return '<div class="notice warn">Демонстрация: фото не анализируется моделью. Гипотезы ниже — пример интерфейса.</div>'+photos(x.photos,x.demo)+(insufficient?'<div class="card"><h2>Пока недостаточно данных</h2><p>Нужны чёткий снимок поражения, общий вид растения и наблюдения в дополнительных точках.</p></div>':'<div class="card"><span class="tag warn">Предварительные гипотезы</span><h2>'+esc(x.title.includes('Пожелт')?'Стресс или нарушение питания':'Септориоз / другое поражение листьев')+'</h2><p>Проверить характер пятен, наличие плодовых тел и распределение симптомов по ярусам.</p><div class="divider"></div><h3>Что ещё может быть причиной</h3><p class="muted">Другие пятнистости, повреждение листа, стресс. Доля поражённого поля по фото не определяется.</p></div>')+'<div class="card"><h3>Следующая проверка</h3><p>Осмотрите нижние и верхние листья, отметьте точки обследования и сопоставьте симптомы.</p><small class="muted">Учебный шаблон · версия 0.1 · экспертная валидация не выполнена</small></div>'+(s.role==='agro'?'<div class="actions"><button data-act="verify">Записать заключение агронома</button><button class="secondary" data-act="additional">Добавить наблюдения</button><button class="ghost" data-act="expert">Запросить эксперта · демо</button></div>':'')}
function caseDetail(){const x=c();if(!x)return '<p>Случай не найден</p>';return '<button class="back" data-act="cases">← Случаи</button><div class="row"><span class="eyebrow">Поле № '+x.field+' · '+esc(f(x.field).name)+'</span>'+badge(x)+'</div><h1>'+esc(x.title)+'</h1><p class="muted">Пшеница · '+esc(x.phase)+'</p><div class="two"><button class="'+(tab==='summary'?'secondary':'ghost')+'" data-act="summary">Случай</button><button class="'+(tab==='history'?'secondary':'ghost')+'" data-act="history">История</button></div>'+(tab==='history'?'<div class="timeline">'+x.history.map(h=>'<p>'+esc(h.text)+'<br><small>'+esc(h.date)+'</small></p>').join('')+'</div>':caseBody(x))}
function caseBody(x){let out='<div class="card"><h3>Наблюдение</h3><p>'+esc(x.note||'Заметка не добавлена')+'</p><span class="tag gray">'+esc(x.spread)+'</span>'+(x.location?'<p class="muted">'+esc(x.location)+'</p>':'')+'</div>';
if(['review','insufficient'].includes(x.status))return out+result(x);
if(x.status==='expert')return out+'<div class="card"><h2>Ожидаем эксперта</h2><p>В реальном сервисе здесь будут уточняющие вопросы и заключение.</p><p class="muted">Запрос в прототипе никому не отправляется.</p><button class="wide" data-act="expertReply">Показать пример ответа</button></div>';
out+='<div class="card"><span class="eyebrow">Заключение агронома</span><h3 style="margin-top:8px">'+esc(x.diagnosis)+'</h3><p class="muted">'+esc(x.conclusion||'Требуется контрольное обследование')+'</p></div>';
if(['confirmed','revision','rejected'].includes(x.status)&&s.role==='agro')out+='<button class="wide" data-act="plan">'+(x.plan?'Пересмотреть план':'Подготовить план →')+'</button>';
if(x.plan){const done=x.tasks.filter(t=>t.done).length;out+='<div class="card"><div class="row"><h3>'+esc(x.plan.type)+'</h3><span class="tag">'+new Intl.NumberFormat('ru-RU').format(x.plan.cost)+' ₽</span></div><p>'+esc(x.plan.note)+'</p><p class="muted">'+esc(x.plan.owner)+' · '+esc(x.plan.date||'Срок не указан')+'</p><small class="muted">Стоимость введена вручную, демо. Препараты и дозировки не назначаются.</small>'+(x.decisionNote?'<div class="notice warn">'+esc(x.decisionNote)+'</div>':'')+'<div class="progress"><i style="width:'+(x.tasks.length?done/x.tasks.length*100:0)+'%"></i></div><small>'+done+' из '+x.tasks.length+' задач выполнено</small></div>';
if(x.status==='pending')out+=s.role==='manager'?'<button class="wide" data-act="decision">Рассмотреть и согласовать →</button>':'<div class="notice">План ждёт решения руководителя. Переключите роль вверху экрана.</div>';
if(['active','control'].includes(x.status)){out+=x.tasks.map(t=>taskCard(x,t)).join('');if(s.role==='agro')out+='<div class="actions"><button data-act="control">Провести контрольный осмотр</button><button class="ghost" data-act="plan">Изменить план</button></div>';}}
if(x.reviews.length)out+='<h2>Контрольные осмотры</h2>'+x.reviews.map(r=>'<div class="card"><span class="tag">'+esc(r.result)+'</span><p>'+esc(r.note)+'</p>'+photos(r.photos)+'<small class="muted">'+esc(r.date)+'</small></div>').join('');
if(x.status==='closed'&&s.role==='agro')out+='<button class="ghost wide" data-act="reopen">Открыть случай повторно</button>';
return out}
function taskCard(x,t){return '<div class="card"><div class="row top"><h3 class="'+(t.done?'taskdone':'')+'">'+esc(t.name)+'</h3><span class="tag '+(t.late&&!t.done?'warn':'')+'">'+(t.done?'Выполнено':t.late?'Срок пропущен':'В работе')+'</span></div><p class="muted">Поле № '+x.field+' · '+esc(t.owner)+'<br>'+esc(t.due||'Демо · сегодня')+'</p>'+(t.proof?'<p>Подтверждение: '+esc(t.proof)+'</p>':'')+(t.reason?'<p>Перенос: '+esc(t.reason)+'</p>':'')+'<button class="ghost wide" data-act="task" data-id="'+x.id+'" data-task="'+t.id+'">'+(t.done?'Посмотреть подтверждение':'Открыть задачу')+'</button></div>'}
function verify(){return '<button class="back" data-act="case">← Случай</button><h1>Ваше заключение</h1><form id="verify"><label for="diagnosis">Причина / рабочая гипотеза</label><input id="diagnosis" name="diagnosis" required value="'+esc(c().diagnosis)+'"><label for="conclusion">Основания и следующий шаг</label><textarea id="conclusion" name="conclusion" required placeholder="Что проверено и что пока неизвестно"></textarea><label class="check"><input type="checkbox" required> Я проверила данные и записываю собственное заключение</label><button class="wide" style="margin-top:18px">Сохранить решение</button></form>'}
function additional(){return '<button class="back" data-act="case">← Случай</button><h1>Дополнительные данные</h1><form id="additional"><label for="extra">Что удалось проверить?</label><textarea id="extra" name="extra" required placeholder="Точки, ярусы листьев, новые признаки"></textarea><label>Добавить фото</label><input type="file" id="extraPhotos" accept="image/*" multiple><div id="extraPreview"></div><button class="wide" style="margin-top:18px">Сохранить наблюдения</button></form>'}
function plan(){const x=c(),p=x.plan||{type:'Обследование и наблюдение',owner:'Анна · агроном',date:datePlus(1),cost:3500,note:'Обследовать отмеченные точки и провести повторный осмотр.'};
return '<button class="back" data-act="case">← Случай</button><span class="eyebrow">Проект плана</span><h1>Что делаем дальше?</h1><div class="notice">Учебный шаблон. Сроки и действия редактирует агроном. Для назначения обработки нужны региональные данные и проверенный протокол.</div><form id="plan"><label for="ptype">Подход</label><select id="ptype" name="type">'+['Обследование и наблюдение','Агротехнические меры','Лабораторная проверка','Подготовка решения об обработке','Обследование'].map(v=>'<option '+(p.type===v?'selected':'')+'>'+v+'</option>').join('')+'</select><label for="pnote">Действия и основания</label><textarea id="pnote" name="note" required>'+esc(p.note)+'</textarea><label for="owner">Ответственный</label><select name="owner" id="owner">'+['Анна · агроном','Михаил · полевые работы'].map(v=>'<option '+(p.owner===v?'selected':'')+'>'+v+'</option>').join('')+'</select><div class="two"><div><label for="pdate">Первая задача</label><input type="date" required name="date" id="pdate" value="'+esc(p.date||datePlus(1))+'"></div><div><label for="cost">Бюджет, ₽</label><input type="number" name="cost" id="cost" min="0" max="100000000" required value="'+p.cost+'"></div></div><label for="firstTask">Задача 1</label><input id="firstTask" name="firstTask" required value="'+esc(x.tasks[0]?.name||'Обследовать дополнительные точки')+'"><label for="secondTask">Задача 2</label><input id="secondTask" name="secondTask" required value="Провести повторный осмотр"><label for="controlDate">Дата повторного осмотра</label><input id="controlDate" name="controlDate" type="date" required value="'+datePlus(4)+'"><div class="notice warn">При изменении действующего плана текущие задачи будут заменены. Их состояние останется в истории случая.</div><div class="actions"><button name="mode" value="approval">Отправить руководителю</button><button class="secondary" name="mode" value="direct">Утвердить в пределах полномочий</button></div></form>'}
function decision(){const x=c();return '<button class="back" data-act="case">← Случай</button><h1>Решение по плану</h1><div class="card"><h3>'+esc(x.plan.type)+'</h3><p>'+esc(x.plan.note)+'</p><h2>'+new Intl.NumberFormat('ru-RU').format(x.plan.cost)+' ₽</h2><p class="muted">Ручная оценка бюджета · срок '+esc(x.plan.date)+'</p><p>Альтернатива: вернуть агроному для уточнения масштаба и ресурсов.</p></div><form id="decision"><label for="decisionNote">Комментарий</label><textarea id="decisionNote" name="note" placeholder="Обязателен для возврата или отказа"></textarea><div class="actions"><button name="choice" value="approve">Согласовать бюджет и план</button><button class="secondary" name="choice" value="revise">Вернуть на уточнение</button><button class="danger" name="choice" value="reject">Отклонить</button></div></form>'}
let taskId='';
function taskDetail(){const t=c().tasks.find(t=>t.id===taskId);return '<button class="back" data-act="case">← Случай</button><h1>'+esc(t.name)+'</h1><p class="muted">'+esc(t.owner)+' · '+esc(t.due||'Демо · сегодня')+'</p>'+(t.done?'<div class="card"><span class="tag">Выполнено</span><p>'+esc(t.proof)+'</p>'+photos(t.photos||[])+'</div>':s.role==='manager'?'<div class="notice">Выполнение фиксирует агроном. Руководитель может проверить причину задержки.</div><p>'+esc(t.reason||'Причина задержки пока не указана')+'</p>':'<form id="task"><label for="proof">Подтверждение выполнения</label><textarea id="proof" name="proof" placeholder="Что сделано, где и с каким результатом"></textarea><label>Фото / результат лаборатории</label><input id="taskPhotos" type="file" accept="image/*" multiple><div id="taskPreview"></div><label for="postpone">Новая дата, если нужен перенос</label><input id="postpone" name="date" type="date" value="'+datePlus(1)+'"><label for="reason">Причина переноса</label><input id="reason" name="reason" placeholder="Например: нет доступа к участку"><div class="actions"><button name="mode" value="complete">Отметить выполненной</button><button class="secondary" name="mode" value="postpone">Перенести задачу</button></div></form>')}
function control(){reviewPhotos=[];return '<button class="back" data-act="case">← Случай</button><h1>Контроль результата</h1><p class="muted">Сравните те же точки и ярусы растения. Старые повреждения могут сохраняться.</p><h3>Первый осмотр</h3>'+photos(c().photos,c().demo)+'<form id="control"><label>Новые фотографии</label><input type="file" id="controlPhotos" accept="image/*" multiple><div id="controlPreview"></div><label for="outcome">Динамика</label><select id="outcome" name="result"><option>Состояние улучшилось</option><option>Без существенных изменений</option><option>Симптомы распространяются</option><option>Недостаточно данных</option></select><label for="controlNote">Что изменилось?</label><textarea id="controlNote" name="note" required placeholder="Новые симптомы, распространение, состояние новых листьев"></textarea><div class="actions"><button name="mode" value="continue">Сохранить и продолжить наблюдение</button><button class="secondary" name="mode" value="revise">Сохранить и пересмотреть план</button><button class="ghost" name="mode" value="close">Завершить случай</button></div></form>'}
function datePlus(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function guide(){return '<button class="back" data-act="home">← Обзор</button><h1>Проверка прототипа</h1><div class="card"><h3>1 · Агроном</h3><p>Новый осмотр → демо-наблюдение → гипотезы → заключение → план → отправить руководителю.</p><h3>2 · Руководитель</h3><p>Переключите роль сверху → Решения → случай → согласовать или вернуть с комментарием.</p><h3>3 · Агроном</h3><p>Выполните задачи с подтверждением → контрольный осмотр → продолжите, пересмотрите план или завершите случай.</p></div><div class="card"><h3>Альтернативные пути</h3><p>В осмотре выберите «Недостаточно данных». Добавьте наблюдения или запросите демо-эксперта. Попробуйте перенести задачу и отклонить план.</p></div><div class="notice">Нет сервера, реального ИИ, отправки эксперту и push-уведомлений. Напоминания представлены в разделе работ. Фото остаются локально. Сохранение между открытиями зависит от браузера.</div><div class="actions"><button data-act="download">Скачать самостоятельный HTML</button><button class="ghost" data-act="export">Экспортировать историю JSON</button><button class="danger" data-act="reset">Сбросить демо-данные</button></div>'}
function render(){ $('role').value=s.role;$('storage').textContent=persistent?'Сохранение на устройстве':'Только эта вкладка';const routes={home,fields:fieldList,field:fieldDetail,observe:observation,case:caseDetail,verify,additional,plan,decision,task:taskDetail,control,guide,cases:()=>'<span class="eyebrow">История поля</span><h1>Случаи</h1>'+s.cases.map(card).join(''),approvals:()=>'<span class="eyebrow">Руководителю</span><h1>Согласования</h1>'+ (s.cases.filter(x=>x.status==='pending').map(card).join('')||'<div class="card empty">Всё рассмотрено.<p class="muted">Агроном может отправить новый план на согласование.</p></div>'),tasks:()=>'<span class="eyebrow">Исполнение и напоминания</span><h1>Работы</h1>'+ (s.cases.flatMap(x=>x.tasks.map(t=>taskCard(x,t))).join('')||'<div class="card empty">Задачи появятся после утверждения плана</div>')};
$('view').innerHTML=(routes[page]||home)();$('nav').innerHTML=buttons().map(([p,i,t])=>'<button data-act="'+p+'" class="'+(page===p?'active':'')+'"><span>'+i+'</span>'+t+'</button>').join('')}
function collectObs(){const form=$('observation');if(!form)return draft;const d=Object.fromEntries(new FormData(form));d.photos=uploaded;d.demo=!!draft?.demo;draft=d;return d}
async function readPhotos(files){const output=[];for(const file of Array.from(files).slice(0,3)){if(!file.type.startsWith('image/')){toast('Выберите изображение');continue}try{const src=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=src});const canvas=document.createElement('canvas');const scale=Math.min(1,900/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);output.push(canvas.toDataURL('image/jpeg',.7))}catch(e){toast('Не удалось открыть фото. Попробуйте JPEG или PNG.')}}return output}
document.addEventListener('change',async e=>{if(e.target.id==='role'){if(page==='observe')collectObs();s.role=e.target.value;save();go('home');return}if(e.target.id==='obsField'){$('phase').value=f(e.target.value).phase}
if(['camera','gallery','extraPhotos','taskPhotos','controlPhotos'].includes(e.target.id)){const id=e.target.id,pics=await readPhotos(e.target.files);if(['camera','gallery'].includes(id)){if(!$('preview'))return;uploaded=uploaded.concat(pics).slice(-3);collectObs();$('preview').innerHTML=photos(uploaded);save()}else {reviewPhotos=pics;const target={extraPhotos:'extraPreview',taskPhotos:'taskPreview',controlPhotos:'controlPreview'}[id];if($(target))$(target).innerHTML=photos(pics)}}});
document.addEventListener('input',e=>{if(page==='observe'&&e.target.closest('#observation')){collectObs();save()}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
if(['home','fields','cases','tasks','approvals','guide'].includes(a)){if(page==='observe'){collectObs();save()}go(a);return}
if(a==='observe'){if(s.role!=='agro')return;go('observe');return}
if(a==='field'){selectedField=b.dataset.id;go('field');return}
if(a==='fieldObserve'){draft=null;go('observe');return}
if(a==='case'){go('case',b.dataset.id||selected);return}
if(a==='summary'||a==='history'){tab=a;render();return}
if(a==='task'){selected=b.dataset.id;taskId=b.dataset.task;reviewPhotos=[];go('task');return}
if(a==='sample'){collectObs();draft.demo=true;draft.note=draft.note||'Пятна на нижних листьях в двух точках обследования.';save();render();toast('Демо-наблюдение добавлено');return}
if(a==='draft'){collectObs();save();toast(persistent?'Черновик сохранён':'Черновик доступен только в этой вкладке');go('home');return}
if(a==='geo'){if(!navigator.geolocation){toast('Геолокация недоступна: введите точку вручную');return}navigator.geolocation.getCurrentPosition(p=>{if(!$('location'))return;$('location').value=p.coords.latitude.toFixed(5)+', '+p.coords.longitude.toFixed(5)+' · точность ±'+Math.round(p.coords.accuracy)+' м';collectObs();save();toast('Координаты добавлены')},()=>toast('Доступ к координатам недоступен. Введите точку вручную.'),{timeout:10000});return}
if(a==='reset'){if(confirm('Удалить ваши изменения и восстановить демо?')){s=seed();draft=null;uploaded=[];selected='C12';save();go('home')}return}
if(a==='download'){const clone=document.documentElement.cloneNode(true);clone.querySelector('#view').innerHTML='';clone.querySelector('#nav').innerHTML='';clone.querySelector('#toast').innerHTML='';download('<!doctype html>\n'+clone.outerHTML,'agro-prototype.html','text/html;charset=utf-8');return}
if(a==='export'){download(JSON.stringify(s,null,2),'agro-history.json','application/json');return}
if(s.role!=='agro'&&a!=='decision'){toast('Это действие доступно агроному');return}
const x=c();if(a==='expert'){x.status='expert';log(x,'Демонстрационный запрос эксперту создан; отправка не выполнялась');save();go('case')}
else if(a==='expertReply'){x.status='review';x.note+=' Пример ответа эксперта: обследуйте дополнительные точки; по одному фото диагноз не подтверждается.';log(x,'Показан учебный ответ эксперта');save();go('case')}
else if(a==='reopen'){x.status='confirmed';log(x,'Случай открыт повторно');save();go('case')}
else if(['verify','additional','plan','control','decision'].includes(a)){if(a==='decision'&&s.role!=='manager')return;reviewPhotos=[];go(a)}
});
document.addEventListener('submit',e=>{e.preventDefault();const form=e.target,id=form.id,d=Object.fromEntries(new FormData(form)),mode=e.submitter?.value;
if(id==='observation'){const data=collectObs();if(!uploaded.length&&!data.demo){toast('Добавьте фото или используйте демо-наблюдение');return}const x={id:uid(),field:data.field,title:data.symptom,status:data.scenario==='insufficient'?'insufficient':'review',diagnosis:'Причина уточняется',phase:data.phase,spread:data.spread,note:data.note,location:data.location,photos:[...uploaded],demo:data.demo,history:[],tasks:[],reviews:[],plan:null};log(x,'Создано наблюдение. Показан демонстрационный результат.');s.cases.unshift(x);draft=null;uploaded=[];save();go('case',x.id);return}
const x=c();if(!x)return;
if(id==='verify'&&s.role==='agro'){x.diagnosis=d.diagnosis;x.conclusion=d.conclusion;x.status='confirmed';log(x,'Заключение агронома: '+d.diagnosis+'. '+d.conclusion)}
else if(id==='additional'&&s.role==='agro'){x.note+='\n'+d.extra;x.photos=x.photos.concat(reviewPhotos).slice(-3);x.status='review';log(x,'Дополнительное обследование: '+d.extra)}
else if(id==='plan'&&s.role==='agro'){if(d.controlDate<d.date){toast('Повторный осмотр должен быть не раньше первой задачи');return}if(x.tasks.length)log(x,'Предыдущие задачи: '+x.tasks.map(t=>t.name+' — '+(t.done?'выполнена':'не выполнена')).join('; '));x.plan={type:d.type,note:d.note,owner:d.owner,date:d.date,cost:Number(d.cost),approval:mode==='approval'?'pending':'approved'};x.tasks=[{id:uid(),name:d.firstTask,owner:d.owner,due:d.date,done:false,proof:'',late:false},{id:uid(),name:d.secondTask,owner:'Анна · агроном',due:d.controlDate,done:false,proof:'',late:false}];x.status=mode==='approval'?'pending':'active';x.decisionNote='';log(x,mode==='approval'?'План отправлен руководителю на согласование':'Агроном утвердил план в пределах полномочий')}
else if(id==='decision'&&s.role==='manager'){if(mode!=='approve'&&!d.note.trim()){toast('Добавьте причину возврата или отказа');return}x.status=mode==='approve'?'active':mode==='revise'?'revision':'rejected';x.plan.approval=mode;x.decisionNote=d.note;log(x,'Руководитель: '+(mode==='approve'?'согласовано':mode==='revise'?'вернуть на уточнение':'отклонено')+'. '+d.note)}
else if(id==='task'&&s.role==='agro'){if(!['active','control'].includes(x.status)){toast('Сначала утвердите или согласуйте план');return}const t=x.tasks.find(t=>t.id===taskId);if(mode==='complete'){if(!d.proof.trim()){toast('Добавьте подтверждение выполнения');return}t.done=true;t.proof=d.proof;t.photos=[...reviewPhotos];log(x,'Выполнено: '+t.name+'. '+d.proof);if(x.tasks.every(t=>t.done))x.status='control'}else{if(!d.reason.trim()||!d.date){toast('Укажите новую дату и причину');return}t.due=d.date;t.reason=d.reason;t.late=false;log(x,'Перенос задачи: '+t.name+' на '+d.date+'. '+d.reason)}}
else if(id==='control'&&s.role==='agro'){if(mode==='close'&&x.tasks.some(t=>!t.done)){toast('Сначала выполните задачи или пересмотрите план');return}if(mode==='close'&&d.result!=='Состояние улучшилось'){toast('Для этой ветки демо выберите улучшение либо продолжите наблюдение');return}x.reviews.unshift({result:d.result,note:d.note,photos:[...reviewPhotos],date:now()});x.status=mode==='close'?'closed':mode==='revise'?'confirmed':'control';log(x,'Контрольный осмотр: '+d.result+'. '+d.note+(mode==='close'?' · Случай закрыт':''));if(mode==='continue'){x.tasks.push({id:uid(),name:'Следующий контрольный осмотр',owner:'Анна · агроном',due:datePlus(3),done:false,proof:'',late:false})}}
else return;
reviewPhotos=[];save();if(id==='control'&&mode==='revise')go('plan');else go('case');toast('Изменения сохранены');
});
function download(data,name,type){const url=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
save();render();
</script></body></html>
